name: Test Matrix
on: [push]

jobs:
  code-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@v6

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.9.3
        with:
          pixi-version: v0.62.2 # good to pin this since pixi is not 1.0 yet!

      - name: look for syntax errors
        run: pixi run ruff check

  unit-tests:
    runs-on: ${{ matrix.os }}
    needs: code-checks # don't bother running tests if code-checks fails.

    strategy:
      fail-fast: false # stop all jobs if one fails
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        environment:
          - default
          - env-py313
          - env-py312

    steps:
      - name: Checkout the code
        uses: actions/checkout@v6

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.9.3
        with:
          pixi-version: v0.62.2 # good to pin this since pixi is not 1.0 yet!
          environments: ${{ matrix.environment }}

      - run: pixi run pytest
