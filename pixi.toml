[workspace]
authors = ["Karl Kosack <karl.kosack@cea.fr>"]
channels = ["conda-forge"]
name = "pkoffee"
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64", "win-64"]
version = "0.1.0"

[tasks]
test = "pytest"

[dependencies]
pytest = ">=9.0.2,<10"
ruff = ">=0.14.10,<0.15"
python = ">=3.14.2,<3.15"

[feature.py313.dependencies]
python = "~=3.13"

[feature.py312.dependencies]
python = "~=3.12"

[environments]
env-py312 = ["py312"]
env-py313 = ["py313"]
